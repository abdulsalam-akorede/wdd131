<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Selected web development and branding projects by Abdulsalam Oke, including a website for Olam's Apparel.">
  <meta name="author" content="Abdulsalam Oke">
  <meta name="theme-color" content="#0B1F3B">
  <title>Projects | Abdulsalam Oke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css?v=3">
  <link rel="stylesheet" href="styles/base-large.css?v=3">
  <script src="scripts/base.js?v=3" defer></script>
</head>
<body data-page="projects">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">

    <section class="page-intro">
      <div class="container">
        <h1>Projects</h1>
        <p>Websites and brand identities I have built. Select a project to see what I made and the tools I used.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="project-filters" role="group" aria-label="Filter projects by category">
          <button class="filter-btn active" data-category="All" aria-pressed="true">All</button>
          <button class="filter-btn" data-category="Web development" aria-pressed="false">Web development</button>
          <button class="filter-btn" data-category="Branding" aria-pressed="false">Branding</button>
        </div>
        <p id="project-visit-count" class="visit-count"></p>
        <div id="projects-grid" class="project-grid"></div>
      </div>
    </section>

    <section class="cta">
      <div class="container">
        <h2>Have a project in mind?</h2>
        <p>If you have a role, project, or collaboration to discuss, I'd be glad to hear from you.</p>
        <a href="contact.html" class="btn">Contact me</a>
      </div>
    </section>

  </main>

  <div id="project-modal" class="project-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close project details">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer id="site-footer"></footer>
</body>
</html>
