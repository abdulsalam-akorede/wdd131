<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Abdulsalam Oke about web development work, projects, or remote opportunities.">
  <meta name="author" content="Abdulsalam Oke">
  <meta name="theme-color" content="#0B1F3B">
  <title>Contact | Abdulsalam Oke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css?v=4">
  <link rel="stylesheet" href="styles/base-large.css?v=4">
  <script src="scripts/base.js?v=4" defer></script>
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>

  <main id="main">

    <section class="page-intro">
      <div class="container">
        <h1>Contact me</h1>
        <p>Have a project or opportunity in mind? Send a message and I'll reply as soon as I can.</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">

        <div class="contact-info">
          <h2>Other ways to reach me</h2>
          <ul class="contact-list">
            <li><span class="contact-label">Email</span><a data-contact="email" href="#">Email</a></li>
            <li><span class="contact-label">LinkedIn</span><a data-contact="linkedin" href="#" target="_blank" rel="noopener noreferrer">LinkedIn profile</a></li>
            <li><span class="contact-label">GitHub</span><a data-contact="github" href="#" target="_blank" rel="noopener noreferrer">GitHub profile</a></li>
            <li><span class="contact-label">Resume</span><a data-contact="resume" href="#" download>Download my resume</a></li>
            <li><span class="contact-label">Location</span><span data-contact="location"></span></li>
          </ul>
        </div>

        <form id="contact-form" class="contact-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label for="email">Your email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </div>
          <div class="hp" aria-hidden="true">
            <label for="website">Leave this field empty</label>
            <input type="text" id="website" name="_gotcha" tabindex="-1" autocomplete="off">
          </div>
          <button type="submit" class="btn" id="form-submit">Send message</button>
          <p id="form-message" class="form-message" role="status"></p>
        </form>

      </div>
    </section>

  </main>

  <footer id="site-footer"></footer>
</body>
</html>
