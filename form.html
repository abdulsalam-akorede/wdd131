<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form | WDD 131</title>

    <meta name="author" content="Abdulsalam Akorede Oke">
    <meta name="description" content="Submit a product review with your rating, installation date, useful features, and written feedback.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">

    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">Product Name</label>

            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>


            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>

                <div class="rating">
                    <label for="rating1">☆</label>
                    <input type="radio" id="rating1" name="rating" value="1" required>

                    <label for="rating2">☆☆</label>
                    <input type="radio" id="rating2" name="rating" value="2" required>

                    <label for="rating3">☆☆☆</label>
                    <input type="radio" id="rating3" name="rating" value="3" required >

                    <label for="rating4">☆☆☆☆</label>
                    <input type="radio" id="rating4" name="rating" value="4" required>

                    <label for="rating5">☆☆☆☆☆</label>
                    <input type="radio" id="rating5" name="rating" value="5" required>
                </div>
            </fieldset>


            <!-- Date of Installation -->
            <label for="installation">Date of Installation</label>
            <input type="date" id="installation" name="installation" required>


            <!-- Useful Features -->
            <fieldset>
                <legend>Useful Features</legend>

                <label for="durability">Durability</label>
                <input type="checkbox" id="durability" name="features" value="durability">
                
                <label for="ease">Ease of Use</label>
                <input type="checkbox" id="ease" name="features" value="ease">
                
                <label for="performance">Performance</label>
                <input type="checkbox" id="performance" name="features" value="performance">
                
                <label for="design">Design</label>
                <input type="checkbox" id="design" name="features" value="design">
                
            </fieldset>


            <!-- Written Review -->
            <label for="review">Written Review <span>(Optional)</span></label>
            <textarea id="review" name="review"></textarea>


            <!-- User Name -->
            <label for="username">Your Name <span>(Optional)</span></label>
            <input type="text" id="username" name="username">


            <!-- Submit -->
            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>
            © <span id="currentyear"></span> Abdulsalam Akorede Oke 🌸 Nigeria
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
